services:
  service-portal:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
      args:
        VESSEL_VERSION: ${VESSEL_VERSION:-}
    container_name: vessel-dev
    restart: unless-stopped
    command: npm run dev -- --hostname 0.0.0.0
    ports:
      - "${VESSEL_BIND_ADDRESS:-127.0.0.1}:${VESSEL_PORT:-55300}:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      PUBLIC_SERVICE_HOST: ${PUBLIC_SERVICE_HOST:-}
      VESSEL_CONTAINER_NAME: vessel-dev
      VESSEL_PUBLIC_URL: ${VESSEL_PUBLIC_URL:-}
      VESSEL_SECRET_KEY: ${VESSEL_SECRET_KEY:?Set a private random VESSEL_SECRET_KEY in .env (at least 32 characters)}
      VESSEL_ADMIN_USERNAME: ${VESSEL_ADMIN_USERNAME:-admin}
      VESSEL_ADMIN_PASSWORD: ${VESSEL_ADMIN_PASSWORD:-}
      VESSEL_COMPOSE_ROOT: /app/data/compose-projects
      VESSEL_GIT_ROOT: ${VESSEL_GIT_ROOT:-/opt/vessel-data/git-sources}
      VESSEL_COMPOSE_SOURCE_ROOT: /app/compose-host
      VESSEL_COMPOSE_SOURCE_HOST_ROOT: ${VESSEL_COMPOSE_HOST_ROOT:-}
      VESSEL_DATABASE_HOST: ${VESSEL_DATABASE_HOST:-}
      VESSEL_DATABASE_PORT: ${VESSEL_DATABASE_PORT:-}
    volumes:
      - .:/app
      - vessel-dev-node-modules:/app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - "${VESSEL_GIT_ROOT:-/opt/vessel-data/git-sources}:${VESSEL_GIT_ROOT:-/opt/vessel-data/git-sources}"
      - ${VESSEL_COMPOSE_HOST_ROOT:-./data/compose-projects}:/app/compose-host:ro

volumes:
  vessel-dev-node-modules:
