services:
  service-portal:
    build:
      context: .
      target: development
    container_name: vessel-dev
    restart: unless-stopped
    command: npm run dev -- --hostname 0.0.0.0
    ports:
      - "${VESSEL_PORT:-55300}:3000"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      PUBLIC_SERVICE_HOST: ${PUBLIC_SERVICE_HOST:-}
      VESSEL_CONTAINER_NAME: vessel-dev
      VESSEL_SECRET_KEY: ${VESSEL_SECRET_KEY:-replace-this-secret-before-exposing}
      VESSEL_ADMIN_USERNAME: ${VESSEL_ADMIN_USERNAME:-admin}
      VESSEL_ADMIN_PASSWORD: ${VESSEL_ADMIN_PASSWORD:-}
      VESSEL_COMPOSE_ROOT: /app/data/compose-projects
      VESSEL_COMPOSE_SOURCE_ROOT: /app/compose-host
      VESSEL_COMPOSE_SOURCE_HOST_ROOT: ${VESSEL_COMPOSE_HOST_ROOT:-}
      VESSEL_DATABASE_HOST: ${VESSEL_DATABASE_HOST:-}
      VESSEL_DATABASE_PORT: ${VESSEL_DATABASE_PORT:-}
    volumes:
      - .:/app
      - vessel-dev-node-modules:/app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ${VESSEL_COMPOSE_HOST_ROOT:-./data/compose-projects}:/app/compose-host:ro

volumes:
  vessel-dev-node-modules:
